name: Windows app

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  # When a GitHub Release is published, build the installer and attach it as
  # StretchCat-Setup.exe (the stable name the website download button points to).
  release:
    types: [published]

defaults:
  run:
    working-directory: windows

jobs:
  # Fast, OS-independent gate: the pure logic that must stay in lockstep with
  # the macOS app. Runs on Linux so it's quick and cheap.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Format
        run: cargo fmt -p reminder-core -- --check
      - name: Clippy
        run: cargo clippy -p reminder-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p reminder-core

  # Real Windows build: proves the tray app + installer compile on the target OS,
  # and publishes the installer when a release is cut.
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        run: cargo tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: stretchcat-windows-installer
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Stage installer under a stable name
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $exe.FullName StretchCat-Setup.exe
      - name: Attach installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: windows/StretchCat-Setup.exe
