<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time to stretch</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <div class="card" id="card">
      <img class="cat" src="assets/cat_stretch.gif" alt="" />

      <div class="body">
        <div class="eyebrow">TIME TO STRETCH</div>
        <div class="title" id="title">Big stretch</div>
        <div class="cue" id="cue">Reach up tall and lengthen your spine.</div>

        <div class="actions">
          <button class="btn snooze" id="snooze">Snooze 10m</button>
          <button class="btn done" id="done">Done ✓</button>
        </div>

        <div class="countdown" id="countdown">Auto-closes in 30s</div>
      </div>
    </div>

    <script src="card.js"></script>
  </body>
</html>
